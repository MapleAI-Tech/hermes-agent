name: Sync Upstream

on:
  schedule:
    - cron: "18 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fork
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main:refs/remotes/upstream/main
        shell: bash {0}

      - name: Sync main with upstream
        id: sync_main
        run: |
          git checkout main
          FORK_HEAD=$(git rev-parse HEAD)
          MERGE_STATUS=0
          git merge --no-ff --no-commit -X ours upstream/main || MERGE_STATUS=$?

          # The fork owns .github/workflows outright; upstream workflow changes
          # are never taken. Force the whole directory back to the fork's state.
          # NOTE: `git restore --staged` cannot resolve modify/delete conflicts
          # (it errors "path unmerged" and leaves them behind), so clear the
          # index entries first, then re-populate from FORK_HEAD, then drop any
          # upstream-only workflow files left in the worktree.
          git rm -rf --cached --ignore-unmatch --quiet .github/workflows
          git checkout "$FORK_HEAD" -- .github/workflows
          git clean -fdq .github/workflows

          REMAINING_CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ -n "$REMAINING_CONFLICTS" ]; then
            echo "Upstream merge produced conflicts outside .github/workflows. Resolve manually:"
            git status --short
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No non-workflow upstream changes to sync."
            git merge --abort || true
          else
            git commit -m "Merge upstream main"
            git submodule update --init --recursive
            git push origin main
          fi
        shell: bash {0}

      - name: Create MapleAI build tag
        run: |
          LATEST_UPSTREAM_TAG=$(git ls-remote --tags --refs upstream 'v*' | awk -F/ '{print $NF}' | sort -V | tail -1)
          if [ -z "$LATEST_UPSTREAM_TAG" ]; then
            echo "No upstream release tag found."
            exit 1
          fi

          MAPLEAI_TAG="mapleai-${LATEST_UPSTREAM_TAG}"
          echo "Creating MapleAI build tag: ${MAPLEAI_TAG}"

          if git ls-remote --exit-code --tags origin "refs/tags/${MAPLEAI_TAG}" >/dev/null 2>&1; then
            echo "Tag ${MAPLEAI_TAG} already exists on origin; leaving it unchanged."
            exit 0
          fi

          git tag "$MAPLEAI_TAG" HEAD
          git push origin "$MAPLEAI_TAG"
        shell: bash {0}
